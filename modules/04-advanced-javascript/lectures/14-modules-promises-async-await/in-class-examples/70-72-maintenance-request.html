<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home maintenance request tracker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
  <h1>Home maintenance request tracker</h1>

    <button id="load-maintenance" type="button">Load request</button>
    <button id="fail-maintenance" type="button">Simulate failure</button>

  <pre id="maintenance-output">No result yet</pre>
</main>

  <script type="module" src="./70-maintenance-solution.js"></script>
