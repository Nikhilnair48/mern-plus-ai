<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message input preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #111827;
      background-color: #f3f4f6;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    h2 {
      margin: 26px 0 10px;
      font-size: 20px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    p {
      margin: 8px 0;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #475569;
    }

    .status {
      margin: 18px 0;
      padding: 14px 16px;
      background-color: #eff6ff;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
      font-weight: 700;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background-color: #2563eb;
      border: 1px solid #2563eb;
      border-radius: 7px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button.secondary {
      color: #1e293b;
      background-color: #ffffff;
      border-color: #94a3b8;
    }

    button.secondary:hover {
      background-color: #f8fafc;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      font: inherit;
      border: 1px solid #94a3b8;
      border-radius: 7px;
    }

    input:focus {
      outline: 3px solid #dbeafe;
      border-color: #2563eb;
    }

    ul {
      margin: 12px 0 0;
      padding-left: 24px;
    }

    li {
      margin-bottom: 8px;
      padding: 9px 11px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .panel {
      margin-top: 18px;
      padding: 18px;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    .note {
      margin-top: 22px;
      padding: 13px 15px;
      background-color: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 7px;
    }

    .success {
      background-color: #dcfce7;
      border-color: #22c55e;
    }

    .error {
      background-color: #fee2e2;
      border-color: #ef4444;
    }

    .muted {
      color: #475569;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    code,
    pre {
      font-family: "Courier New", monospace;
    }

    code {
      padding: 2px 5px;
      background-color: #e2e8f0;
      border-radius: 4px;
    }

    pre {
      margin: 12px 0 0;
      padding: 14px;
      overflow-x: auto;
      color: #ffffff;
      background-color: #0f172a;
      border-radius: 8px;
    }

    .demo-result {
      margin-top: 12px;
      padding: 12px 14px;
      background-color: #f3f4f6;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 10px;
      }

      main {
        padding: 20px;
      }

      .two-column {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!--
  Slides covered: 28-29

  Demo order:
  1. Type in the input.
  2. Observe the input event running after each change.
  3. Connect event.target.value to the preview text.
-->
  <main>
    <p class="eyebrow">Lecture 12 demo</p>
    <h1>Message preview</h1>

    <label for="message-input"><strong>Message</strong></label>
    <input id="message-input" type="text" placeholder="Type a message">

    <div class="panel">
      <h2>Preview</h2>
      <p id="message-preview" class="status">Your message will appear here.</p>
    </div>

    <p class="note">
      The preview uses the current value stored in <code>event.target.value</code>.
    </p>
  </main>
  <script>
    const messageInput = document.querySelector("#message-input");

    const messagePreview = document.querySelector("#message-preview");

    function handleMessageInput(event) {
      messagePreview.textContent = event.target.value;
    }

    messageInput.addEventListener(
      "input", handleMessageInput
    );
  </script>
</body>

</html>
