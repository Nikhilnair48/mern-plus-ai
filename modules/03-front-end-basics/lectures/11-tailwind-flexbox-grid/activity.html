<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Coworking Room Directory</title>
</head>

<body class="bg-stone-100 p-6">
    <main class="mx-auto max-w-5xl">
        <h1 class="mb-6 text-center text-4xl font-bold">
            Coworking Room Directory
        </h1>

        <!-- Responsive Grid -->
        <section class="grid grid-cols-1 gap-6 md:grid-cols-3">

            <!-- Room Card -->
            <article class="rounded-lg border border-stone-300 bg-white p-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-semibold">Focus Room</h2>

                    <span class="rounded-full bg-green-100 px-3 py-1 text-sm font-bold text-green-700">
                        Available
                    </span>
                </div>
            </article>

            <!-- Room Card -->
            <article class="rounded-lg border border-stone-300 bg-white p-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-semibold">Team Room</h2>

                    <span class="rounded-full bg-red-100 px-3 py-1 text-sm font-bold text-red-700">
                        Booked
                    </span>
                </div>
            </article>

            <!-- Room Card -->
            <article class="rounded-lg border border-stone-300 bg-white p-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-semibold">Quiet Desk</h2>

                    <span class="rounded-full bg-green-100 px-3 py-1 text-sm font-bold text-green-700">
                        Available
                    </span>
                </div>
            </article>

        </section>
    </main>
</body>

</html>
