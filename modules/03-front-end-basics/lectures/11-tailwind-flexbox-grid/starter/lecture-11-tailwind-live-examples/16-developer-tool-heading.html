<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 16 - Developer tool heading</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

  <main class="mx-auto max-w-3xl px-6 py-12">
    <header class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Flexbox code-along</p>
      <h1 class="mt-2 text-3xl font-bold">Arrange a developer-tool heading</h1>
      <p class="mt-2 text-slate-600">Add one utility at a time and predict the result.</p>
    </header>

    <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
      <div class="border-b border-slate-200 bg-slate-50 px-6 py-4">
        <!-- LIVE STEPS:
           class="flex"
           class="flex items-center"
           class="flex items-center justify-between"
      -->
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-blue-700">Code editor</p>
            <h2 class="text-2xl font-bold">Visual Studio Code</h2>
          </div>

          <span class="mt-3 inline-block rounded-full bg-emerald-100 px-3 py-1 text-sm font-semibold text-emerald-800">
            Installed
          </span>
        </div>
      </div>

      <div class="p-6">
        <p class="text-slate-600">
          Edit source code, run extensions, inspect Git changes, and debug applications.
        </p>
        <div class="mt-5 flex flex-wrap gap-2">
          <span class="rounded-md bg-slate-100 px-2.5 py-1 text-sm">TypeScript</span>
          <span class="rounded-md bg-slate-100 px-2.5 py-1 text-sm">Git</span>
          <span class="rounded-md bg-slate-100 px-2.5 py-1 text-sm">Debugging</span>
        </div>
      </div>
    </article>
  </main>

</body>

</html>
