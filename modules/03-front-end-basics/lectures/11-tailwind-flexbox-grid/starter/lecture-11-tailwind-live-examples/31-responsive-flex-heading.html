<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 31 - Responsive flex heading</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

  <main class="mx-auto max-w-5xl px-4 py-10 sm:px-6">
    <!-- LIVE OPTION:
       Start with: flex flex-col gap-4
       Then add: md:flex-row md:items-center md:justify-between
  -->
    <header
      class="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-indigo-700">Developer workflow</p>
        <h1 class="mt-1 text-3xl font-bold">Developer Tools Catalog</h1>
        <p class="mt-2 text-slate-600">A small set of tools for common development tasks.</p>
      </div>

      <div class="flex items-center gap-3">
        <span class="rounded-full bg-slate-100 px-3 py-2 text-sm font-medium text-slate-700">6 tools</span>
        <button class="rounded-lg bg-indigo-700 px-4 py-2 font-semibold text-white">
          Add tool
        </button>
      </div>
    </header>

    <section class="mt-8 rounded-xl border border-dashed border-indigo-300 bg-indigo-50 p-5 text-indigo-950">
      <p><strong>Narrow:</strong> the heading and actions stack.</p>
      <p class="mt-2"><strong><code>md</code> and wider:</strong> they share one aligned row.</p>
    </section>
  </main>

</body>

</html>
