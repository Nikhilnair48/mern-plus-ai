<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem Syntax</title>
    <style>
        /* CSS shown in Slide 19 */
        h2 {
            font-size: 2rem;
        }

        section {
            padding: 2rem;
        }

        /* Supporting style */
        section {
            border: 1px solid gray;
        }
    </style>
</head>
<body>
    <section>
        <h2>About the Course</h2>
        <p>This section uses root-relative typography and spacing.</p>
    </section>
</body>
</html>
