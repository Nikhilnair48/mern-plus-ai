<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Card with rem</title>
    <style>
        /* CSS shown in Slide 20 */
        .course-card {
            padding: 2rem;
            /* 1rem = 16px */
            border-radius: 0.5rem;
        }

        .course-card h2 {
            font-size: 2rem;
        }

        .course-card p {
            font-size: 1rem;
        }

        /* Supporting style */
        .course-card {
            border: 1px solid gray;
        }
    </style>
</head>

<body>
    <article class="course-card">
        <h2>Frontend Engineering</h2>
        <p>Learn how HTML and CSS work together to build user interfaces.</p>
    </article>
</body>

</html>
