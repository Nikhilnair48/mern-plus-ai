<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem Scaling Checkpoint</title>
    <style>
        /* Correct CSS option from Slide 21 */
        h2 {
            font-size: 2rem;
        }

        section {
            padding: 2rem;
        }

        /* Supporting style */
        section {
            border: 1px solid gray;
        }
    </style>
</head>
<body>
    <section>
        <h2>Featured Product</h2>
        <p>Typography and spacing scale from the root font size.</p>
    </section>
</body>
</html>
