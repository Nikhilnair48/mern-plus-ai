<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Book Width</title>
    <style>
        /* Correct CSS option from Slide 18 */
        .book {
            width: 90%;
        }

        /* Supporting styles */
        .book {
            padding: 20px;
            border: 1px solid gray;
        }
    </style>
</head>

<body>
    <article class="book">
        <h2>Responsive Web Design</h2>
        <p>A practical introduction to layouts that adapt across screen sizes.</p>
    </article>
</body>

</html>
