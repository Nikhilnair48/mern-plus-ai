<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Reference</title>
    <style>
        /* Supporting styles */
        .card {
            width: 280px;
            padding: 24px;
            border: 1px solid gray;
        }

        /* CSS shown in Slide 6 */
        .card {
            position: relative;
        }

        .label {
            position: absolute;
            top: 8px;
            right: 8px;
        }
    </style>
</head>
<body>
    <!-- HTML shown in Slide 6 -->
    <div class="card">
        <span class="label">New</span>
        <h2>Frontend Course</h2>
    </div>
</body>
</html>
