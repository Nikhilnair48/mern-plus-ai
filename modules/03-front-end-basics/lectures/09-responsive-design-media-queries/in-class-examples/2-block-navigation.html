<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Navigation Links</title>
    <style>
        /* Correct CSS option from Slide 7 */
        nav a {
            display: block;
        }

        /* Supporting styles */
        nav a {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Curriculum</a>
        <a href="#">Instructor</a>
        <a href="#">Enroll</a>
    </nav>
</body>
</html>
