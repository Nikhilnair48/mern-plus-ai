<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section with Viewport Units</title>
    <style>
        body {
            margin: 0;
        }

        /* CSS shown in Slide 23 */
        .hero {
            width: 100vw;
            min-height: 60vh;
        }

        /* Supporting styles */
        .hero {
            padding: 2rem;
            background-color: #eaf2ff;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>Explore the World</h1>
        <p>The hero occupies the full viewport width and at least 60% of its height.</p>
    </section>
</body>
</html>
