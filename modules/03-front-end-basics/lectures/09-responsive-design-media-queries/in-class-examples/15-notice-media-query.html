<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Media Query</title>
    <style>
        /* CSS shown in Slide 37 */
        .notice {
            font-size: 1rem;

        @media (max-width: 500px) {

                font-size: 1.25rem;

        /* Supporting style */

            padding: 1rem;
            border: 1px solid gray;
        }
