<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Category Links</title>
    <style>
        /* Supporting default style */
        .category-link {
            margin-right: 16px;
        }

        /* Correct Media Query option from Slide 36 */
        @media (max-width: 768px) {
            .category-link {
                display: block;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a class="category-link" href="#">Fiction</a>
        <a class="category-link" href="#">Technology</a>
        <a class="category-link" href="#">History</a>
        <a class="category-link" href="#">Science</a>
    </nav>
</body>
</html>
