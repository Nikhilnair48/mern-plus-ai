<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Link, Visited, Hover, Active */
        a {
            color: red;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
        }

        a:hover {
            font-weight: bold;
        }

        a:active {
            background-color: yellow;
        }

        #highlight:hover {}

        /* a:nth-of-type(1) {
            background-color: yellow;
        } */
        p:nth-of-type(3) a {
            font-size: 24px;
        }
    </style>
</head>

<body>
    <p>
        <a href="https://www.google.com">Visit Google (Unvisited)</a>
    </p>
    <p>
        <a href="https://www.guvi.com">Another link (Might be visited)</a>
    </p>
    <p>
        <a href="https://www.example.com">Visit Example (Might be visited)</a>
    </p>
</body>

</html>
