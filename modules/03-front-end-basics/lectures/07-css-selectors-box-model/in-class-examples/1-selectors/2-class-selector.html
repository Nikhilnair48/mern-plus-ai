<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CSS class card: 
        property named border whose value is "10px solid black"
    -->
    <style>
        .card {
            border: 10px dashed blue;
            padding: 10px;
            margin: 50px;
        }

        .important {
            font-weight: bold;
            color: red;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Card Title 1</h2>
        <p class="important">This is important content.</p>
    </div>
    <div class="card highlight">
        <h2>Card Title 2</h2>
        <p>Some regular content.</p>
    </div>
</body>

</html>
