<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* You can optionally add this to explicitly set display: block */
        div {
            display: block;
        }

        p {
            display: block;
        }
    </style>
</head>

<body>
    <div style="border: 1px solid red;">First div</div>
    <div style="border: 1px solid blue;">Second div</div>
    <p style="border: 1px solid green;">First paragraph.</p>
    <p style="border: 1px solid orange;">Second paragraph.</p>
</body>

</html>
