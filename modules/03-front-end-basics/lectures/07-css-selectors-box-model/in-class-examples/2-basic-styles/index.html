<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <section class="profile-card">
            <img class="profile-image"
                src="https://media.istockphoto.com/id/2151669184/vector/vector-flat-illustration-in-grayscale-avatar-user-profile-person-icon-gender-neutral.jpg?s=612x612&w=0&k=20&c=UEa7oHoOL30ynvmJzSCIPrwwopJdfqzBs0q69ezQoM8="
                alt="Profile photo">

            <h1 class="profile-name">Nikhil</h1>
            <p class="profile-title">Software Engineer</p>

            <p class="profile-bio">
                I am learning HTML, CSS, JavaScript, and React. I enjoy building simple
                projects and improving them step by step.
            </p>

            <div class="profile-skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
            </div>

            <a class="profile-link" href="https://github.com" target="_blank">
                View GitHub
            </a>
        </section>
    </main>
</body>

</html>
