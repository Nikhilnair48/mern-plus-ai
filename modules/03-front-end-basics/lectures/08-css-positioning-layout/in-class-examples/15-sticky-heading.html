    <title>15-sticky-heading.html</title>

<body>
    <style>
        .panel {
            height: 220px;
            overflow: auto;
            border: 1px solid #888
        }

        h2 {
            position: sticky;
            top: 0;
            background: #fff;
            margin: 0;
            padding: 10px
        }

        p {
            padding: 10px
        }
    </style>

        <p>Line 9</p>
        <p>Line 10</p>
        <p>Line 11</p>
        <p>Line 12</p>
        <p>Line 13</p>
        <p>Line 14</p>
        <p>Line 15</p>
        <p>Line 16</p>
        <p>Line 17</p>
        <p>Line 18</p>
        <p>Line 19</p>
        <p>Line 20</p>
    </div>
</body>

</html>
