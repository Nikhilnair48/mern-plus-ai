<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>9-relative.html</title>
</head>

<body>
    <style>
        .step {
            border: 1px solid #999;
            padding: 10px;
            margin: 15px 0
        }

        .current {
            position: relative;
            top: 10px;
            left: 40px;
            border-color: blue
        }
    </style>
    <div class='step'>Step 1</div>
    <div class='step current'>Step 2</div>
    <div class='step'>Step 3</div>
</body>

</html>
