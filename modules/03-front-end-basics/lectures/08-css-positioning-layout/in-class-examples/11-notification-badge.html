<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>11-notification-badge.html</title>
</head>

<body>
    <style>
        .notification-icon {
            position: relative;
            display: inline-block;
            font-size: 40px;
            padding: 12px;
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 18px;
            background-color: red;
            color: white;
            font-size: 14px;
            text-align: center;
            padding: 4px;
            border-radius: 999px;
        }
    </style>
    <div class="notification-icon">
        <span class="bell">🔔</span>
        <span class="badge">3</span>
    </div>

</body>

</html>
