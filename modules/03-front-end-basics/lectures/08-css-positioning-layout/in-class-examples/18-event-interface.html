<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>18-event-interface.html</title>
</head>

<body>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            min-height: 1400px
        }

        .event {
            position: relative;
            background: #fff;
            padding: 24px;
            border: 1px solid #ccc
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: #fff;
            padding: 4px 8px
        }

        .schedule {
            height: 220px;
            overflow: auto;
            border: 1px solid #ccc;
            margin-top: 20px
        }

        .schedule h2 {
            position: sticky;
            top: 0;
            background: #fff;
            margin: 0;
            padding: 10px
        }

        .schedule p {
            padding: 10px;
            margin: 0;
            border-bottom: 1px solid #eee
        }

        .help {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #2563eb;
            color: #fff;
            padding: 12px;
            color: white
        }
    </style>
    <div class='event'><span class='badge'>LIVE</span>
        <h1>Frontend Workshop</h1>
    </div>
    <div class='schedule'>
        <h2>Schedule</h2>
        <p>Session 1</p>
        <p>Session 2</p>
        <p>Session 3</p>
        <p>Session 4</p>
        <p>Session 5</p>
        <p>Session 6</p>
        <p>Session 7</p>
        <p>Session 8</p>
        <p>Session 9</p>
        <p>Session 10</p>
        <p>Session 11</p>
        <p>Session 12</p>
        <p>Session 13</p>
        <p>Session 14</p>
    </div><a class='help'>Help</a>
</body>

</html>
