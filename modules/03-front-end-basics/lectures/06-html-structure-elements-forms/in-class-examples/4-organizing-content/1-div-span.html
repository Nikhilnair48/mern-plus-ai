<!DOCTYPE html>
<html>

<head>
    <title>Div and Span</title>
</head>

<body>
    <!-- Header -->
    <div>
        <h1>Welcome to My Website</h1>
        <p>This is the header section.</p>
    </div>

    <!-- Main content -->
    <div>
        <p>This is the main content. It contains <span>important</span> information.</p>
        <p>Another paragraph in the content.</p>
    </div>

    <!-- Footer -->
    <div>
        <p>&copy; 2024 My Website</p>
    </div>
</body>

</html>
